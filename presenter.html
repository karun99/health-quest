<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Health Quest — presenter deck. Demo script, cue cards and 3-minute pitch.">
<meta name="author" content="K Subramanya Satyanarayana, St. John's English Medium School">
<title>Health Quest — Presenter Deck</title>
<style>
  :root{
    --bg:#0f1512; --surface:#17201b; --ink:#eef6f0; --soft:#9fb4a6;
    --primary:#3ddc84; --primary-soft:#173a28; --accent:#f5b83e; --line:#28342c;
    --radius:16px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:1000px;margin:0 auto;padding:26px 18px 60px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#4caf7c);display:grid;place-items:center;font-size:1.5rem}
  header h1{font-size:1.5rem;letter-spacing:-.02em}
  header .tag{font-size:.78rem;color:var(--soft);font-weight:600;text-transform:uppercase;letter-spacing:.1em}
  .controls{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .btn{padding:10px 16px;border-radius:12px;font-weight:700;font-size:.88rem;border:none;cursor:pointer;color:#0f1512}
  .btn-primary{background:var(--primary)}
  .btn-accent{background:var(--accent)}
  .btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
  .timerbox{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:999px}
  .timerbox b{font-variant-numeric:tabular-nums;font-size:1.2rem}
  .meterbox{width:150px;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
  .meterbox i{display:block;height:100%;width:0;background:var(--primary);transition:width .3s linear}

  .stage{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,54px);min-height:46vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .caption{position:absolute;top:16px;left:20px;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
  .counter{position:absolute;top:14px;right:20px;font-size:.8rem;font-weight:800;color:var(--soft)}
  .stage h2{font-size:clamp(1.5rem,4vw,2.4rem);letter-spacing:-.02em;line-height:1.2}
  .stage p{color:var(--soft);margin-top:14px;max-width:62ch;font-size:clamp(.95rem,2vw,1.08rem)}
  .stage .em{color:var(--primary);font-weight:800}
  .stage ul{margin:16px 0 0 22px;color:var(--soft)}
  .stage li{margin:6px 0}
  .stage .big{font-size:clamp(2.4rem,9vw,4.6rem);font-weight:800;color:var(--primary);line-height:1}
  .bignote{margin-top:14px}
  .qr{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .qr img{width:160px;height:160px;border-radius:14px;background:#fff;padding:6px;image-rendering:pixelated}
  .qr .link{font-size:1.05rem;font-weight:800;color:var(--primary);word-break:break-all}

  .decknav{display:flex;gap:8px;align-items:center;margin-top:20px;flex-wrap:wrap}
  .decknav button{background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:700;cursor:pointer}
  .decknav button:hover{border-color:var(--primary);color:var(--primary)}
  .decknav span{color:var(--soft);font-size:.82rem;margin:0 6px}
  .progress{flex:1;min-width:120px;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
  .progress i{display:block;height:100%;background:var(--primary);width:0;transition:width .25s}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
  .panel h3{font-size:.9rem;color:var(--primary);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
  .panel p,.panel li{font-size:.88rem;color:var(--soft)}
  .panel ul{margin-left:18px}
  .panel b{color:var(--ink)}
  .checkbox{display:flex;gap:10px;align-items:center;margin:8px 0;cursor:pointer;font-size:.9rem}
  .checkbox input{accent-color:var(--primary);width:18px;height:18px}
  code{background:#0f1512;border:1px solid var(--line);padding:2px 7px;border-radius:6px;font-size:.84em;color:var(--primary)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">🥗</div>
    <div>
      <h1>Health Quest — Presenter Deck</h1>
      <div class="tag">PanIIT Andhra Pradesh · 2026 · demo in 3 minutes</div>
    </div>
    <div class="controls">
      <div class="timerbox"><b id="timer">00:00</b><div class="meterbox"><i id="bar"></i></div><button class="btn btn-accent" id="timerBtn">Start 3:00</button></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <span class="caption" id="cap">Intro</span>
    <span class="counter" id="counter">1 / 8</span>
    <div id="slide"></div>
  </div>

  <div class="decknav">
    <button onclick="go(0)">⏮</button>
    <button onclick="go(-1)">← Prev</button>
    <span id="idx">Slide 1 of 8</span>
    <button onclick="go(1)">Next →</button>
    <button onclick="go(7)">⏭</button>
    <div class="progress"><i id="prog"></i></div>
  </div>

  <div class="panel">
    <h3>Presenter notes (your cue card)</h3>
    <div id="notes"></div>
  </div>

  <div class="panel">
    <h3>Pre-demo checklist</h3>
    <label class="checkbox"><input type="checkbox" id="c1"> Phones on Wi-Fi + data fallback</label>
    <label class="checkbox"><input type="checkbox" id="c2"> Open game → ethics banner visible</label>
    <label class="checkbox"><input type="checkbox" id="c3"> Play 2 rounds prepared (one wrong on purpose)</label>
    <label class="checkbox"><input type="checkbox" id="c4"> PIN code of local eatery ready</label>
    <label class="checkbox"><input type="checkbox" id="c5"> “Why this rating” tapped on one venue</label>
    <label class="checkbox"><input type="checkbox" id="c6"> Markdown export downloaded + import tested</label>
    <label class="checkbox"><input type="checkbox" id="c7"> BYOK keys saved in localStorage</label>
    <label class="checkbox"><input type="checkbox" id="c8"> QR code printed on poster + on this deck</label>
  </div>

  <div class="panel">
    <h3>Open links</h3>
    <p><a style="color:var(--primary)" href="/">▶ Play the game</a> · <a style="color:var(--primary)" href="/explainer">📖 Explainer</a> · <a style="color:var(--primary)" href="/ieee">⚙️ IEEE configuration</a></p>
  </div>

</div>

<script>
"use strict";
const SLIDES = [
  {
    title: 'So, what is Health Quest?',
    body: 'An <span class="em">ethical food-education game</span> for school students (Classes 8–12). Learn to identify the healthiest food — and understand <em>why</em>, with a transparent Michelin-style Health Score.',
    note: "Hook: “Millions of kids trust food scores they can’t verify. Health Quest makes every number explainable — and takes 3 minutes to prove.”"
  },
  {
    title: 'Problem',
    body: '<ul><li>Diet misinformation is everywhere.</li><li>Food apps rate restaurants in a <strong>black box</strong>.</li><li>Pressure mechanics (timers, streaks, guilt) hurt vulnerable kids.</li></ul>',
    note: 'Keep it to 30 seconds. Three items, three finger points.'
  },
  {
    title: 'Our answer in one line',
    body: '“A static, offline-first web app. No backend, no database, no tracking. Users bring their own AI keys. The whole thing costs <span class="em">₹0 to run — forever.</span>”',
    note: 'Say this slowly. Pause after “₹0 to run forever”.'
  },
  {
    title: 'Demo — Play 2 rounds',
    body: 'Watch the ethics banner, then pick “Play”.<br><br>Round 1: <span class="em">I’ll intentionally choose wrong</span> — and show you that “wrong” here is just a lesson, not a loss.<br><br>Round 2: choose the healthier dish and read the “Why” table.',
    note: 'The deliberate wrong answer PROVES the no-pressure promise. Judges remember this.'
  },
  {
    title: 'The transparent score',
    body: 'Every food is scored /100 from 5 honest bars — Nutrition, Whole-food factor, Sugar &amp; salt, Healthy fats, Balance. No hidden points. <span class="em">“Why this rating”</span> is one tap away.',
    note: 'Show the 5 bars on the game card. Compare idli (82) vs samosa (42).'
  },
  {
    title: 'Demo — Locate Nearby',
    body: 'Enter your PIN code → <span class="em">real eateries</span> appear within 2 km from OpenStreetMap.<br><br>Tap “Why this rating” → the venue’s own 4-criteria breakdown opens. Tap “Open in Maps” → live navigation.',
    note: 'Use the PIN code of a busy area. If offline, the app says so honestly and shows clearly-labelled demo data.'
  },
  {
    title: 'Privacy & ethics',
    body: 'Location used <span class="em">once, never stored</span>. No tracking, no analytics, no cookies. AI keys live in <code>localStorage</code>, in the user’s browser. Inspired by Pokémon Go, Blue Whale and Michelin — and designed against all three mistakes.',
    note: 'Close the loop: “No timers. No pressure. No tracking. Kids learn by understanding, not by fear.”'
  },
  {
    title: 'Download & ship',
    body: 'Export the food database as <span class="em">Markdown</span> for transparent review.<br>MIT-licensed, zero-cost, deployed on Vercel.<br><br><div class="qr">🧾 <span style="font-size:.4em"><img id="qrImg" alt="QR to this live site"></span><span class="link" id="liveUrl">—</span></div>',
    note: 'Hand judges the QR on your poster: “Scan it — the game is already live on the internet, right now.”'
  }
];

let cur = 0;
const stage = document.getElementById('stage');
const slide = document.getElementById('slide');
const cap = document.getElementById('cap');
const counter = document.getElementById('counter');
const notes = document.getElementById('notes');
const idxTxt = document.getElementById('idx');
const prog = document.getElementById('prog');

function render(){
  const s = SLIDES[cur];
  slide.innerHTML = '<h2>' + s.title + '</h2><p>' + s.body + '</p>';
  cap.textContent = s.title;
  counter.textContent = (cur+1) + ' / ' + SLIDES.length;
  idxTxt.textContent = 'Slide ' + (cur+1) + ' of ' + SLIDES.length;
  prog.style.width = ((cur+1)/SLIDES.length*100) + '%';
  notes.innerHTML = s.note;
  if(cur === SLIDES.length-1){
    const url = location.origin + location.pathname.replace(/presenter\.html$/, '');
    document.getElementById('liveUrl').textContent = location.origin || url;
    const qr = document.getElementById('qrImg');
    const target = encodeURIComponent(location.origin || url);
    qr.src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + target;
  }
  stage.scrollIntoView({behavior:'smooth', block:'start'});
}
function go(n){
  if(typeof n === 'number' && n >= 0 && n < SLIDES.length) cur = n;
  else cur = Math.max(0, Math.min(SLIDES.length-1, cur + n));
  render();
}
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
  if(e.key === ' ') { e.preventDefault(); go(1); }
});
document.querySelector('.stage').addEventListener('click', () => go(1));
['c1','c2','c3','c4','c5','c6','c7','c8'].forEach(id => {
  const el = document.getElementById(id);
  el.checked = localStorage.getItem('hq_check_' + id) === '1';
  el.addEventListener('change', () => localStorage.setItem('hq_check_' + id, el.checked ? '1' : '0'));
});

/* countdown timer */
const DUR = 180;
let left = DUR, running = false, intv = null;
const tEl = document.getElementById('timer'), barEl = document.getElementById('bar'), btnT = document.getElementById('timerBtn');
function fmt(s){ const m = Math.floor(s/60), r = s%60; return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0'); }
function paint(){ tEl.textContent = fmt(left); barEl.style.width = ((DUR-left)/DUR*100) + '%'; if(left<=0){ stop(); } }
function stop(){ clearInterval(intv); running=false; btnT.textContent = left<=0 ? 'Restart 3:00' : 'Start 3:00'; }
btnT.addEventListener('click', () => {
  if(running){ stop(); return; }
  left = DUR; running = true; paint();
  intv = setInterval(() => { left--; paint(); }, 1000);
  btnT.textContent = 'Pause';
});
render();
</script>
</body>
</html>
