[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-quest"
version = "3.1.0"
description = "Ethics-first food-literacy game for school students with a transparent Michelin-style Health Score and consent-first OpenStreetMap eatery lookup."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Sai Karun Nandipati", email = "saikarun085@gmail.com" },
    { name = "K Subramanya Satyanarayana" },
]
requires-python = ">=3.9"
keywords = ["education", "food-literacy", "health", "ethics", "games"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

[tool.setuptools]
packages = ["health_quest"]

[tool.setuptools.data-files]
"share/health-quest" = [
    "health-quest.html",
    "explainer.html",
    "explainer-ieee.html",
    "presenter.html",
]